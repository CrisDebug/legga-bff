# CORS para Azure
legga.cors.allowed-origins=https://agreeable-forest-0ef55150f.3.azurestaticapps.net

# Seguridad para produccion
legga.security.dev-mode=false

# Microservicios
legga.ms-legajos.base-url=${MS_LEGAJOS_URL}
legga.ms-documentos.base-url=${MS_DOCUMENTOS_URL}


# Carga de documentos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-http-form-post-size=12MB