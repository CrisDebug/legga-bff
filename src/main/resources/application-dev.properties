
# ==========================================
# LEGGA - PERFIL DE DESARROLLO
# ==========================================

# CORS para Angular local
legga.cors.allowed-origins=http://localhost:4200

# Seguridad para desarrollo
legga.security.dev-mode=true

# Microservicios locales
legga.ms-legajos.base-url=${MS_LEGAJOS_URL:http://localhost:8081}
legga.ms-documentos.base-url=${MS_DOCUMENTOS_URL:http://localhost:8082}



# Carga de documentos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-http-form-post-size=12MB