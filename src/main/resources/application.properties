
spring.application.name=bff-legga

server.port=${PORT:8080}

# Perfil activo por defecto
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Información de LEGGA
info.app.name=LEGGA BFF
info.app.description=Backend for Frontend de LEGGA
info.app.version=0.0.1

# Microservicios LEGGA
legga.ms-legajos.base-url=${MS_LEGAJOS_URL:http://localhost:8081}
legga.ms-documentos.base-url=${MS_DOCUMENTOS_URL:http://localhost:8082}

# Logs de seguridad
logging.level.org.springframework.security=INFO


# Carga de documentos
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
server.tomcat.max-http-form-post-size=12MB